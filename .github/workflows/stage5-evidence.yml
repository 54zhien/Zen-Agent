name: Stage 5 cold failure evidence
on:
  push:
    branches: [codex/s5-handoff-repairs-20261007]
    paths: [.github/workflows/stage5-evidence.yml]
permissions:
  actions: read
  contents: read
jobs:
  export:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11555360836'
          run-id: 37784846258
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/archived
          merge-multiple: true
      - name: Decode original cold focus loss
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/decoded"
          bundle="$RUNNER_TEMP/archived/ColdFocus.xcresult"
          xcrun xcresulttool get test-results summary --path "$bundle" > "$RUNNER_TEMP/decoded/summary.json"
          xcrun xcresulttool get test-results tests --path "$bundle" > "$RUNNER_TEMP/decoded/tests.json"
          xcrun xcresulttool export diagnostics --path "$bundle" --output-path "$RUNNER_TEMP/diagnostics"
          find "$RUNNER_TEMP/diagnostics" -type f > "$RUNNER_TEMP/decoded/inventory.txt"
          while IFS= read -r archive; do
            /usr/bin/log show --archive "$archive" --style compact \
              --start '2026-10-08 13:51:49' --end '2026-10-08 13:52:06' \
              --info --debug --predicate 'process == "ZenAgent" OR process == "SpringBoard" OR process == "keyboardservicesd"' \
              >> "$RUNNER_TEMP/decoded/cold-focus-window.log" 2>&1
          done < <(find "$RUNNER_TEMP/diagnostics" -name '*.logarchive' -type d)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-cold-failure-decoded
          path: ${{ runner.temp }}/decoded
          retention-days: 7
