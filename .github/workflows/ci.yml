name: Decode archived Composer menu crash
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  decode:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Verify the saved failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/decoded"
          gh api repos/54zhien/Zen-Agent/actions/runs/39303939285 > "$RUNNER_TEMP/decoded/run.json"
          gh api repos/54zhien/Zen-Agent/actions/artifacts/12214740213 > "$RUNNER_TEMP/decoded/artifact.json"
          jq -e '.head_sha == "7da0dbd69c36c99885b6478a7f864d0dfc1fcf4f" and .conclusion == "failure"' "$RUNNER_TEMP/decoded/run.json"
          jq -e '.workflow_run.id == 39303939285 and .digest == "sha256:b9e6a35dff5cd9b9df7b39d0ddef4c3b441e8c5945237403dbc380f182565d6e"' "$RUNNER_TEMP/decoded/artifact.json"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 12214740213
          run-id: 39303939285
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/archived
      - name: Read saved crash diagnostics without running the application
        run: |
          set -euo pipefail
          result=$(find "$RUNNER_TEMP/archived" -maxdepth 3 -type d -name Focused.xcresult -print -quit)
          test -n "$result"
          xcodebuild -version > "$RUNNER_TEMP/decoded/toolchain.txt"
          xcrun xcresulttool get log --path "$result" --type console > "$RUNNER_TEMP/decoded/console.log" 2> "$RUNNER_TEMP/decoded/console.stderr" || true
          xcrun xcresulttool export diagnostics --path "$result" --output-path "$RUNNER_TEMP/diagnostics" > "$RUNNER_TEMP/decoded/export.log" 2> "$RUNNER_TEMP/decoded/export.stderr"
          find "$RUNNER_TEMP/diagnostics" -type f > "$RUNNER_TEMP/decoded/files.txt"
          mkdir -p "$RUNNER_TEMP/decoded/reports"
          find "$RUNNER_TEMP/diagnostics" -type f \( -name '*.ips' -o -name '*.crash' \) -exec cp {} "$RUNNER_TEMP/decoded/reports/" \;
          count=0
          while IFS= read -r -d '' archive; do
            count=$((count + 1))
            /usr/bin/log show --archive "$archive" --style syslog --timezone UTC --start '2026-10-19 18:54:35' --end '2026-10-19 18:55:35' --info --debug --no-signpost --no-pager --color none > "$RUNNER_TEMP/decoded/system-$count.log" 2> "$RUNNER_TEMP/decoded/system-$count.stderr"
          done < <(find "$RUNNER_TEMP/diagnostics" -type d -name '*.logarchive' -print0)
          printf 'Archives: %s\n' "$count" > "$RUNNER_TEMP/decoded/summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composer-crash-diagnostics
          path: ${{ runner.temp }}/decoded
          retention-days: 7
