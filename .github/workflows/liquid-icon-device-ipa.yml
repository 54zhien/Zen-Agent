name: Liquid icon device IPA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen source and owner-authorized direct package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'codex/device-ipa-sidebar-shadow-ea347848a78c'
          source=ea347848a78c1afad7bcd551c07634316feca8df
          test "$(git rev-parse "$source^{tree}")" = '88a70dbeedcb4986dd4dd1f3d88c5a97b420adba'
          git merge-base --is-ancestor "$source" HEAD
          git merge-base --is-ancestor 5934dd0ff8bf035dc2ac9c52d8340ba19aab4e6c "$source"
          git merge-base --is-ancestor 21570f32717f9c01965990699c3abb48aca7f2fe "$source"
          test "$(git diff --no-renames --name-only "$source" HEAD)" = '.github/workflows/liquid-icon-device-ipa.yml'
          git diff --exit-code "$source" HEAD -- App Config Resources project.yml
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39348312559" > "$RUNNER_TEMP/SidebarShadowGate.json"
          python3 - "$RUNNER_TEMP/SidebarShadowGate.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          assert result['status']=='completed' and result['conclusion']=='failure'
          assert result['head_sha']=='db4e00569e80fcae5398cb6f9f1b403f3428d3ff' and result['run_attempt']==1
          PY
          git diff --exit-code db4e00569e80fcae5398cb6f9f1b403f3428d3ff 360bbb7c63152f9e8ac796f90c55dd9545ffb535 -- App Config Resources project.yml Tests
          git diff --exit-code 360bbb7c63152f9e8ac796f90c55dd9545ffb535 "$source" -- App Config Resources project.yml Tests ':(exclude)App/Conversation/ComposerActionMenuPresenter.swift' ':(exclude)App/Conversation/ComposerActionMenuView.swift'
          printf '%s' '' | /usr/bin/base64 -D > "$RUNNER_TEMP/SidebarShadowFocusedSummary.json"
          echo 'Device candidate: native build and 11 focused tests passed; 2 Sidebar UI tests failed and are unresolved. No full test run.'

      - name: Toolchain versions
        run: xcodebuild -version
      - name: Compile icon alone and verify appearance fills
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/IconProbe"
          xcrun actool Resources/zen.icon --compile "$RUNNER_TEMP/IconProbe" \
            --app-icon zen --platform iphoneos --minimum-deployment-target 26.0 \
            --target-device iphone --target-device ipad --output-format human-readable-text \
            --notices --warnings --output-partial-info-plist "$RUNNER_TEMP/IconProbe.plist"
          xcrun assetutil --info "$RUNNER_TEMP/IconProbe/Assets.car" > "$RUNNER_TEMP/IconProbe.json"
          cat "$RUNNER_TEMP/IconProbe.json"
          python3 .github/scripts/verify_liquid_icon.py "$RUNNER_TEMP/IconProbe.json"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          xcodegen generate
          python3 - <<'PY'
          from pathlib import Path
          text = Path('ZenAgent.xcodeproj/project.pbxproj').read_text()
          assert 'zen.icon in Resources' in text
          assert 'icon.json in Resources' not in text
          assert 'zen-dark.svg in Resources' not in text
          PY
      - name: Build unsigned device app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ZenAgent.xcodeproj \
            -scheme ZenAgent \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/ZenAgentDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG ZEN_DEVICE_TEST'

      - name: Verify compiled primary icon
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/ZenAgentDeviceDerivedData/Build/Products/Debug-iphoneos/ZenAgent.app"
          python3 - "$app" <<'PY'
          import pathlib, plistlib, sys
          app = pathlib.Path(sys.argv[1])
          info = plistlib.loads((app/'Info.plist').read_bytes())
          icons = info['CFBundleIcons']['CFBundlePrimaryIcon']
          assert icons['CFBundleIconName'] == 'zen', icons
          assert (app/'Assets.car').stat().st_size > 0
          print('Compiled primary icon:', icons)
          PY
          xcrun assetutil --info "$app/Assets.car" > "$RUNNER_TEMP/CompiledIconAssets.json"
          python3 .github/scripts/verify_liquid_icon.py "$RUNNER_TEMP/CompiledIconAssets.json" --output "$RUNNER_TEMP/ICON-APPEARANCE-VERIFICATION.json"
      - name: Strip unlicensed interface font and package IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/ZenAgentDeviceDerivedData/Build/Products/Debug-iphoneos/ZenAgent.app"
          test -d "$app"
          test -f "$app/Anthropic Sans.ttf"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = 'com.zhien.zen'
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")" = '26.0'
          test "$(/usr/bin/lipo -archs "$app/ZenAgent")" = 'arm64'
          if /usr/bin/codesign -dv "$app" >/dev/null 2>&1; then
            echo 'App unexpectedly contains a code signature' >&2
            exit 1
          fi

          stage="$RUNNER_TEMP/ZenAgentDeviceStage"
          output="$RUNNER_TEMP/ZenAgentDeviceOutput"
          mkdir -p "$stage/Payload" "$output/LICENSES"
          /usr/bin/ditto "$app" "$stage/Payload/ZenAgent.app"
          rm -- "$stage/Payload/ZenAgent.app/Anthropic Sans.ttf"
          python3 - "$stage/Payload/ZenAgent.app/Info.plist" <<'PY'
          import os
          import plistlib
          import sys

          path = sys.argv[1]
          with open(path, 'rb') as file:
              info = plistlib.load(file)
          fonts = info['UIAppFonts']
          assert fonts.count('Anthropic Sans.ttf') == 1
          info['UIAppFonts'] = [font for font in fonts if font != 'Anthropic Sans.ttf']
          info['CFBundleVersion'] = '26.10.' + os.environ['GITHUB_RUN_NUMBER']
          with open(path, 'wb') as file:
              plistlib.dump(info, file)
          PY

          name='ZenAgent-Sidebar-Shadow-ea34784-device-test.ipa'
          (cd "$stage" && /usr/bin/zip -qry "$output/$name" Payload)
          /usr/bin/unzip -tq "$output/$name"
          if /usr/bin/unzip -Z1 "$output/$name" | grep -i 'Anthropic'; then
            echo 'Unlicensed interface font remains in IPA' >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/SidebarShadowGate.json" "$output/"
          cp "$RUNNER_TEMP/SidebarShadowFocusedSummary.json" "$output/"
          cp "$RUNNER_TEMP/CompiledIconAssets.json" "$output/"
          cp "$RUNNER_TEMP/ICON-APPEARANCE-VERIFICATION.json" "$output/"
          /usr/bin/shasum -a 256 Resources/zen.icon/icon.json Resources/zen.icon/Assets/*.svg > "$output/ICON-SHA256SUMS.txt"
          cp Resources/Fonts/LICENSE-SourceHanSerif.txt "$output/LICENSES/"
          cp Resources/Fonts/LICENSE-JetBrainsMono.txt "$output/LICENSES/"
          (cd "$output" && /usr/bin/shasum -a 256 "$name" > SHA256SUMS.txt)
          {
            echo 'Frozen source: ea347848a78c1afad7bcd551c07634316feca8df'
            echo 'Frozen tree: 88a70dbeedcb4986dd4dd1f3d88c5a97b420adba'
            echo 'Focused Sidebar check receipt: https://github.com/54zhien/Zen-Agent/actions/runs/39348312559'
            echo 'Focused result: 11 passed, 2 failed; not an all-passing result. Dark Settings hittability and lower-source Split Sidebar opening remain unresolved.'
            echo 'Contains shadowless divider handle and Single-matched shadow composition around two independent Split card silhouettes.'
            echo 'Approved Divider backdrop/fade, per-card outlines and Pane geometry are preserved.'
            echo 'After the focused run, Composer opening/dismissal durations were slightly lengthened and model checkmarks moved right with shared leading text alignment; this final app is built in this package job.'
            echo 'Prior Composer submenu Simulator failure is inherited; this package does not test or resolve it.'
            echo 'No full test run requested or executed for this package.'
            echo "CFBundleVersion: 26.10.$GITHUB_RUN_NUMBER"
            echo "Packaging commit: $GITHUB_SHA"
            echo "Packaging tree: $(git rev-parse HEAD^{tree})"
            echo "Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'Variant: unsigned Debug device build, System Sans interface font'
            echo 'Bundle ID: com.zhien.zen'
            echo 'Minimum iOS: 26.0'
            echo 'Architecture: arm64'
            xcodebuild -version
          } > "$output/BUILD-INFO.txt"

      - name: Upload unsigned IPA and provenance
        uses: actions/upload-artifact@v4
        with:
          name: ZenAgent-Sidebar-Shadow-ea34784-device-test
          path: ${{ runner.temp }}/ZenAgentDeviceOutput/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
