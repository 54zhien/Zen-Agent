name: Stage 5 cold focus stack evidence
on:
  push:
    branches: [codex/s5-handoff-repairs-20261007]
    paths: [.github/workflows/stage5-cold-stack.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Capture native stacks during the unchanged cold regression
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -n 1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          test -n "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p "$RUNNER_TEMP/ColdStacks"
          cat > "$RUNNER_TEMP/watch-stacks.py" <<'PY'
          import os, pathlib, subprocess, time
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ColdStacks'
          deadline = time.monotonic() + 1200
          while time.monotonic() < deadline and not (output / 'done').exists():
              listing = subprocess.check_output(['/bin/ps', '-axo', 'pid=,comm='], text=True)
              matches = [line.strip().split(None, 1) for line in listing.splitlines()
                         if line.rstrip().endswith('/ZenAgent.app/ZenAgent')]
              if matches:
                  pid = matches[0][0]
                  (output / 'capture.txt').write_text(f'pid={pid}\nstarted={time.time()}\n')
                  # External, bounded sampling only. No app hooks or keyboard warmup.
                  with (output / 'sample-tool.log').open('w') as log:
                      result = subprocess.run(['/usr/bin/sample', pid, '30', '10',
                          '-file', str(output / 'app.sample.txt')], stdout=log, stderr=log)
                  with (output / 'capture.txt').open('a') as receipt:
                      receipt.write(f'finished={time.time()}\nexit={result.returncode}\n')
                  break
              time.sleep(0.1)
          PY
          python3 "$RUNNER_TEMP/watch-stacks.py" &
          WATCHER=$!
          set +e
          xcodebuild test -project ZenAgent.xcodeproj -scheme ZenAgent \
            -configuration Debug -destination "id=$UDID" \
            '-only-testing:ZenAgentTests/WorkspaceComposerDockTests/focusIntentSurvivesOutgoingThenIncomingThenDockUpdateOrder(preserveOutgoing:)' \
            -resultBundlePath "$RUNNER_TEMP/ColdStack.xcresult" 2>&1 | tee "$RUNNER_TEMP/ColdStack.log"
          TEST_EXIT=${PIPESTATUS[0]}
          touch "$RUNNER_TEMP/ColdStacks/done"
          wait "$WATCHER"
          set -e
          test -s "$RUNNER_TEMP/ColdStacks/app.sample.txt"
          test "$TEST_EXIT" -eq 0
          grep -Eq 'Test run with 1 test in 1 suite passed' "$RUNNER_TEMP/ColdStack.log"
          ! grep -Fq 'Restarting after unexpected exit, crash, or test timeout' "$RUNNER_TEMP/ColdStack.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-stack-logs
          path: |
            ${{ runner.temp }}/ColdStack.log
            ${{ runner.temp }}/ColdStacks
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-stack-result
          path: ${{ runner.temp }}/ColdStack.xcresult
          retention-days: 7
