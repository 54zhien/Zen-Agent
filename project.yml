# XcodeGen project definition — the source of truth for the Xcode project.
#
# `.xcodeproj` is generated from this file and is NOT committed. Do not hand-edit
# project.pbxproj; edit this file or the Config/*.xcconfig instead.
# See Docs/ADR/0002-project-generation-xcodegen.md.
#
# Regenerate with:  xcodegen generate

name: ZenAgent

options:
  bundleIdPrefix: com.zhien.zenagent
  createIntermediateGroups: true
  # NOTE: deployment targets deliberately live in Config/Common.xcconfig, not here.
  # Build settings written into the project file override xcconfig values, so
  # declaring them in both places would silently make the xcconfig non-authoritative.

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: "7.11.1"

# Build-setting policy (deployment targets, Swift language mode, concurrency
# checking) lives in Config/*.xcconfig, not here — for the same precedence reason
# as above. This file describes project *structure*; the xcconfig files describe
# *settings*.

targets:

  # ---------------------------------------------------------------- app target
  ZenAgent:
    type: application
    platform: iOS
    sources:
      - path: App
      # Declared as the whole directory, not file by file, so that adding a
      # typeface later cannot half-land: a font that is on disk but missing from
      # this list would fail `FontRegistry` at runtime rather than at review time.
      # XcodeGen adds each file inside to Copy Bundle Resources, so the fonts land
      # flat in the bundle root — which is what makes the bare-file-name
      # `UIAppFonts` entries below correct rather than merely convenient.
      - path: Resources/Fonts
        buildPhase: resources
    dependencies:
      # The production persistence layer. Confined to App/Persistence/ and enforced
      # by the CI hygiene job. See Docs/ADR/0001.
      - package: GRDB
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Zen Agent
        UILaunchScreen: {}
        # Bare file names, with no `Fonts/` prefix: the resources above are copied
        # to the bundle root, so a subdirectory here would name nothing. This is
        # only the launch-time half of font wiring — `FontRegistry` re-registers the
        # same manifest explicitly so a missing asset can name the file it wanted.
        UIAppFonts:
          - Anthropic Sans.ttf
          - SourceHanSerifSC-VF.ttf
          - JetBrainsMono-Regular.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ZEN_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

  # ------------------------------------------------------------ app unit tests
  ZenAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ZenAgentTests
    dependencies:
      - target: ZenAgent
      # Linked so the one test file that deliberately bypasses the store can write to
      # the database directly and prove the constraint holds without it.
      - package: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES


schemes:

  ZenAgent:
    build:
      targets:
        ZenAgent: all
        ZenAgentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZenAgentTests

