name: Composer unsigned device IPA

# Explicit user request: build and package only; do not run tests.
on:
  push:
    branches:
      - codex/composer-ipa-20261020

permissions:
  actions: read
  contents: read

concurrency:
  group: ui-polish-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen source and packaging-only changes
        shell: bash
        run: |
          set -euo pipefail
          source=ed9173a0bf1dc680b7a7d30be33cc6b4f9d3dbd7
          # The fix is cherry-picked onto the packaging branch; compare source trees.
          git diff --exit-code "$source" HEAD -- . ':!.github/workflows/ci.yml' ':!.github/workflows/ui-polish-device-ipa.yml'

      - name: Toolchain versions
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned Debug device app with System Sans
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ZenAgent.xcodeproj \
            -scheme ZenAgent \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/ZenAgentDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG ZEN_DEVICE_TEST'

      - name: Strip Anthropic Sans and package the unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/ZenAgentDeviceDerivedData/Build/Products/Debug-iphoneos/ZenAgent.app"
          test -d "$app"
          test -f "$app/Anthropic Sans.ttf"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = 'com.zhien.zen'
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")" = '26.0'
          test "$(/usr/bin/lipo -archs "$app/ZenAgent")" = 'arm64'
          if /usr/bin/codesign -dv "$app" >/dev/null 2>&1; then
            echo 'App unexpectedly contains a code signature' >&2
            exit 1
          fi

          build_id="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          stage="$RUNNER_TEMP/ZenAgentDeviceStage"
          output="$RUNNER_TEMP/ZenAgentDeviceOutput"
          verify="$RUNNER_TEMP/ZenAgentDeviceVerify"
          mkdir -p "$stage/Payload" "$output/LICENSES" "$verify"
          /usr/bin/ditto "$app" "$stage/Payload/ZenAgent.app"
          python3 - "$stage" "$stage/Payload/ZenAgent.app" "$build_id" <<'PY'
          import os
          from pathlib import Path
          import plistlib
          import re
          import sys

          stage_root = Path(sys.argv[1]).resolve()
          staged_app = Path(sys.argv[2]).resolve()
          build_id = sys.argv[3]
          expected_stage = Path(os.environ["RUNNER_TEMP"]).resolve() / "ZenAgentDeviceStage"
          assert stage_root == expected_stage
          assert staged_app == stage_root / "Payload" / "ZenAgent.app"
          assert staged_app.is_dir()
          font_path = staged_app / "Anthropic Sans.ttf"
          assert font_path.is_file()
          font_path.unlink()
          assert not font_path.exists()

          assert re.fullmatch(r"[0-9]+(?:\.[0-9]+){0,2}", build_id), build_id
          plist_path = staged_app / "Info.plist"
          assert plist_path.is_file()
          with plist_path.open("rb") as file:
              info = plistlib.load(file)
          fonts = info.get("UIAppFonts")
          assert isinstance(fonts, list)
          assert fonts.count("Anthropic Sans.ttf") == 1, fonts
          info["UIAppFonts"] = [font for font in fonts if font != "Anthropic Sans.ttf"]
          info["CFBundleVersion"] = build_id
          with plist_path.open("wb") as file:
              plistlib.dump(info, file)
          PY

          ipa_name="ZenAgent-Composer-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.ipa"
          ipa="$output/$ipa_name"
          (cd "$stage" && /usr/bin/zip -qry "$ipa" Payload)
          /usr/bin/unzip -tq "$ipa"
          /usr/bin/unzip -q "$ipa" -d "$verify"

          packaged_app="$verify/Payload/ZenAgent.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$packaged_app/Info.plist")" = 'com.zhien.zen'
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$packaged_app/Info.plist")" = '26.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$packaged_app/Info.plist")" = "$build_id"
          test "$(/usr/bin/lipo -archs "$packaged_app/ZenAgent")" = 'arm64'
          if /usr/bin/codesign -dv "$packaged_app" >/dev/null 2>&1; then
            echo 'Packaged app unexpectedly contains a code signature' >&2
            exit 1
          fi
          if /usr/bin/unzip -Z1 "$ipa" | grep -qi 'anthropic'; then
            echo 'Anthropic resource remains in the IPA' >&2
            exit 1
          fi
          python3 - "$ipa" "$build_id" <<'PY'
          import plistlib
          import sys
          import zipfile

          ipa, build_id = sys.argv[1:]
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
              assert "Payload/ZenAgent.app/Info.plist" in names
              assert not any("anthropic" in name.lower() for name in names)
              info = plistlib.loads(archive.read("Payload/ZenAgent.app/Info.plist"))
          assert info["CFBundleVersion"] == build_id
          assert info["CFBundleIdentifier"] == "com.zhien.zen"
          assert info["MinimumOSVersion"] == "26.0"
          assert "Anthropic Sans.ttf" not in info["UIAppFonts"]
          assert "SourceHanSerifSC-VF.ttf" in info["UIAppFonts"]
          assert "JetBrainsMono-Regular.ttf" in info["UIAppFonts"]
          PY

          cp Resources/Fonts/LICENSE-SourceHanSerif.txt "$output/LICENSES/"
          cp Resources/Fonts/LICENSE-JetBrainsMono.txt "$output/LICENSES/"
          ipa_sha256=$(/usr/bin/shasum -a 256 "$ipa" | /usr/bin/awk '{print $1}')
          (cd "$output" && /usr/bin/shasum -a 256 "$ipa_name" > SHA256SUMS.txt)
          {
            echo "Source SHA: $GITHUB_SHA"
            echo "Packaging tree: $(git rev-parse HEAD^{tree})"
            echo "Application source SHA: ed9173a0bf1dc680b7a7d30be33cc6b4f9d3dbd7"
            echo "Tests: not run, per explicit user request"
            echo "Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "CFBundleVersion: $build_id"
            echo "IPA SHA-256: $ipa_sha256"
            echo 'Variant: unsigned Debug device build, DEBUG ZEN_DEVICE_TEST, System Sans interface font'
            echo 'Bundle ID: com.zhien.zen'
            echo 'Minimum iOS: 26.0'
            echo 'Architecture: arm64'
            xcodebuild -version
          } > "$output/BUILD-INFO.txt"

      - name: Upload unsigned IPA and provenance
        uses: actions/upload-artifact@v4
        with:
          name: ZenAgent-Composer-device-ipa-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ZenAgentDeviceOutput/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
