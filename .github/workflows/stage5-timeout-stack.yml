name: Stage 5 single focus-call stack
on:
  push:
    branches: [codex/s5-handoff-repairs-20261007]
    paths: [.github/workflows/stage5-timeout-stack.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Capture the original focus-call boundary once
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -n 1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          test -n "$UDID"
          export UDID
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p "$RUNNER_TEMP/FaultStacks"
          touch "$RUNNER_TEMP/FaultFocus.log"
          cat > "$RUNNER_TEMP/watch-fault.py" <<'PY'
          import os, pathlib, re, subprocess, time
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          output = root / 'FaultStacks'
          trigger_seen = False
          native_log = output / 'native-fault.log'
          native_log.touch()
          log_output = native_log.open('w')
          log_error = (output / 'native-stream.stderr').open('w')
          logger = subprocess.Popen(['xcrun', 'simctl', 'spawn', os.environ['UDID'],
              'log', 'stream', '--style', 'compact', '--level', 'debug',
              '--predicate', 'process == "ZenAgent" AND (eventMessage CONTAINS "S5_FOCUS_CALL_CAPTURE" OR eventMessage CONTAINS "Keyboard queue task timeout detected")'],
              stdout=log_output, stderr=log_error)
          try:
            with native_log.open(errors='replace') as stream:
              pending = ''
              while True:
                  if logger.poll() is not None:
                      raise RuntimeError('Native log stream exited before capture completed')
                  chunk = stream.readline()
                  if not chunk:
                      if (output / 'done').exists():
                          break
                      time.sleep(0.02)
                      continue
                  pending += chunk
                  if not pending.endswith('\n'):
                      continue
                  line, pending = pending, ''
                  # log stream prints its predicate before the event rows.
                  if not re.match(r'\d{4}-\d{2}-\d{2} ', line):
                      continue
                  if 'S5_FOCUS_CALL_CAPTURE' not in line:
                      continue
                  trigger_seen = True
                  match = re.search(r'ZenAgent\[(\d+):', line)
                  if not match:
                      (output / 'unresolved-timeout.txt').write_text(line)
                      raise RuntimeError('Focus-call marker observed but application PID is missing')
                  pid = match.group(1)
                  identity = subprocess.check_output(['/bin/ps', '-p', pid, '-o', 'comm='], text=True).strip()
                  if pathlib.Path(identity).name != 'ZenAgent':
                      raise RuntimeError('Marker PID is not the application')
                  (output / 'trigger.txt').write_text(f'pid={pid}\nidentity={identity}\nobserved={time.time()}\n{line}')
                  # The first A focus call bounds this capture. Sampling affects
                  # scheduling; a passing run cannot establish a repair.
                  with (output / 'sample-tool.log').open('w') as log:
                      result = subprocess.run(['/usr/bin/sample', pid, '8', '10', '-mayDie',
                          '-file', str(output / 'app.sample.txt')], stdout=log, stderr=log)
                  with (output / 'trigger.txt').open('a') as receipt:
                      receipt.write(f'finished={time.time()}\nexit={result.returncode}\n')
                  if result.returncode != 0 or not (output / 'app.sample.txt').is_file():
                      raise RuntimeError('Native stack capture failed; inspect the tool receipt')
                  report = (output / 'app.sample.txt').read_text(errors='replace')
                  if not re.search(r'Process:\s+ZenAgent\s+\[' + re.escape(pid) + r'\]', report) or 'Main Thread' not in report:
                      (output / 'invalid-sample.txt').write_text('Missing matching process header or main-thread graph.\n')
                      raise RuntimeError('Native sample does not identify the target main thread')
                  break
          finally:
              logger.terminate()
              try:
                  logger.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  logger.kill()
                  logger.wait()
              log_output.close()
              log_error.close()
          if not trigger_seen:
              (output / 'no-trigger.txt').write_text('Expected focus-call marker was not observed; capture is incomplete.\n')
              raise RuntimeError('Missing original test focus-call capture marker')
          PY
          python3 "$RUNNER_TEMP/watch-fault.py" &
          WATCHER=$!
          set +e
          xcodebuild test -project ZenAgent.xcodeproj -scheme ZenAgent \
            -configuration Debug -destination "id=$UDID" \
            '-only-testing:ZenAgentTests/WorkspaceComposerDockTests/focusIntentSurvivesOutgoingThenIncomingThenDockUpdateOrder(preserveOutgoing:)' \
            -resultBundlePath "$RUNNER_TEMP/FaultFocus.xcresult" 2>&1 | tee "$RUNNER_TEMP/FaultFocus.log"
          TEST_EXIT=${PIPESTATUS[0]}
          touch "$RUNNER_TEMP/FaultStacks/done"
          wait "$WATCHER"
          WATCH_EXIT=$?
          set -e
          printf 'test_exit=%s\nwatcher_exit=%s\n' "$TEST_EXIT" "$WATCH_EXIT" > "$RUNNER_TEMP/FaultStacks/result.txt"
          test "$WATCH_EXIT" -eq 0
          test "$TEST_EXIT" -eq 0
          grep -Eq 'Test run with 1 test in 1 suite passed' "$RUNNER_TEMP/FaultFocus.log"
          ! grep -Fq 'Restarting after unexpected exit, crash, or test timeout' "$RUNNER_TEMP/FaultFocus.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focus-call-logs
          path: |
            ${{ runner.temp }}/FaultFocus.log
            ${{ runner.temp }}/FaultStacks
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focus-call-result
          path: ${{ runner.temp }}/FaultFocus.xcresult
          retention-days: 7
