name: Stage 5 archived evidence
on:
  push:
    branches: [codex/s5-handoff-repairs-20261007]
    paths: [.github/workflows/stage5-evidence.yml]
permissions:
  actions: read
  contents: read
jobs:
  export:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11552094176'
          run-id: 37781102671
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/archived
          merge-multiple: true
      - name: Decode failed native dispatch interval
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/decoded"
          bundle=$(find "$RUNNER_TEMP/archived" -maxdepth 3 -name '*.xcresult' -type d | head -n 1)
          test -n "$bundle"
          xcrun xcresulttool get test-results summary --path "$bundle" > "$RUNNER_TEMP/decoded/summary.json"
          xcrun xcresulttool get test-results tests --path "$bundle" > "$RUNNER_TEMP/decoded/tests.json"
          xcrun xcresulttool export diagnostics --path "$bundle" --output-path "$RUNNER_TEMP/diagnostics"
          find "$RUNNER_TEMP/diagnostics" -type f > "$RUNNER_TEMP/decoded/inventory.txt"
          while IFS= read -r archive; do
            /usr/bin/log show --archive "$archive" --style compact \
              --start '2026-10-08 13:13:13' --end '2026-10-08 13:13:28' \
              --info --debug --predicate 'process == "ZenAgent" OR process == "SpringBoard"' \
              >> "$RUNNER_TEMP/decoded/native-dispatch-window.log" 2>&1
          done < <(find "$RUNNER_TEMP/diagnostics" -name '*.logarchive' -type d)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-native-dispatch-evidence
          path: ${{ runner.temp }}/decoded
          retention-days: 7
