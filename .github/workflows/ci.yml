name: CI

# Stage 0 gate: the project must be regenerable from source, buildable, and
# testable without any local Xcode edits. Everything below runs from a clean
# checkout — nothing here depends on a committed .xcodeproj.

on:
  push:
    # Every branch, not just main: this box has no local Swift toolchain, so a
    # compile error on a working branch goes undetected until it is merged — which
    # is how the Codable omission reached `main` review instead of dying on the
    # branch's own push. `concurrency.cancel-in-progress` already collapses rapid
    # pushes to the same ref, so running on every branch costs nothing extra.
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # -------------------------------------------------------------------------
  # Cheap, fast, and verifies two of Stage 0's completion criteria directly:
  #   - .xcodeproj is generated, not committed
  #   - signing material cannot be committed by an ordinary `git add .`
  # Runs in seconds, so it fails fast before any macOS runner is provisioned.
  # -------------------------------------------------------------------------
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generated Xcode project must not be tracked
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch 'ZenAgent.xcodeproj' >/dev/null 2>&1; then
            echo "::error::ZenAgent.xcodeproj is tracked. It is generated from project.yml and must not be committed."
            exit 1
          fi
          echo "OK: no .xcodeproj in the index"

      - name: Signing material and secrets must be ignored
        run: |
          set -euo pipefail
          failed=0
          for f in \
            "AuthKey_ABC123.p8" \
            "Certificates.p12" \
            "dev.cer" \
            "req.certSigningRequest" \
            "profile.mobileprovision" \
            "Secrets.xcconfig" \
            "build.xcresult" \
            "ZenAgent.xcodeproj/project.pbxproj"
          do
            if git check-ignore -q "$f"; then
              echo "OK: $f is ignored"
            else
              echo "::error::$f is NOT ignored — it could be committed by 'git add .'"
              failed=1
            fi
          done
          exit $failed

      - name: GRDB must not escape the persistence layer
        run: |
          set -euo pipefail
          # A grep proves nothing about a tree that is not there. Rename App/ and
          # this step searches nothing, finds no offenders, and prints OK — so the
          # premise is asserted first: the tree searched, and the layer directory
          # whose confinement is the actual claim.
          for required in App App/Persistence; do
            if [ ! -d "$required" ]; then
              echo "::error::$required/ is missing; this check needs updating rather than removing."
              exit 1
            fi
          done
          offenders=$(grep -rl "import GRDB" App --include="*.swift" | grep -v '^App/Persistence/' || true)
          if [ -n "$offenders" ]; then
            echo "::error::GRDB is imported outside App/Persistence/:"
            echo "$offenders"
            echo "The storage engine must not reach the Runtime or the UI. See Docs/ADR/0001."
            exit 1
          fi
          echo "OK: GRDB is confined to App/Persistence/"

      - name: Security.framework must not escape the credential layer
        run: |
          set -euo pipefail
          # See the GRDB step above: an absent tree cannot produce offenders, so a
          # rename of App/ or of the credential layer would read as a pass.
          for required in App App/Credential; do
            if [ ! -d "$required" ]; then
              echo "::error::$required/ is missing; this check needs updating rather than removing."
              exit 1
            fi
          done
          offenders=$(grep -rl "import Security" App --include="*.swift" | grep -v '^App/Credential/' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Security.framework is imported outside App/Credential/:"
            echo "$offenders"
            echo "Callers must go through CredentialStoring, not the Keychain directly. See Docs/ADR/0003."
            exit 1
          fi
          echo "OK: Security.framework is confined to App/Credential/"

      - name: URLSession must not escape the HTTP layer
        run: |
          set -euo pipefail
          # Matches *code*, not a mention. `URLSession` has no import to key on, so a
          # bare word search would fire on a comment that merely names it — the kind of
          # false positive that gets a check deleted rather than fixed. Lines whose first
          # non-whitespace is a comment marker are ignored; a trailing comment on a code
          # line still counts, because the code line counts anyway.
          # See the GRDB step above: an absent tree cannot produce offenders, so a
          # rename of App/ or of the HTTP layer would read as a pass.
          for required in App App/HTTP; do
            if [ ! -d "$required" ]; then
              echo "::error::$required/ is missing; this check needs updating rather than removing."
              exit 1
            fi
          done
          offenders=$(grep -rn "URLSession" App --include="*.swift"             | grep -v '^App/HTTP/'             | grep -vE ':[[:space:]]*(//|///|\*)'             || true)
          if [ -n "$offenders" ]; then
            echo "::error::URLSession is referenced outside App/HTTP/:"
            echo "$offenders"
            echo "Providers talk to HTTPTransport, so retry/timeout/cancellation policy has one home."
            exit 1
          fi
          echo "OK: URLSession is confined to App/HTTP/"

      - name: DeepSeek's wire format must not escape its adapter
        run: |
          set -euo pipefail
          # Type *declarations* only, at column zero, which is where a top-level Swift
          # type sits. Extensions and ordinary references are not the problem; a DTO
          # defined somewhere else is.
          # See the GRDB step above: an absent tree cannot produce offenders, so a
          # rename of App/ or of the adapter's directory would read as a pass.
          for required in App App/Provider/DeepSeek; do
            if [ ! -d "$required" ]; then
              echo "::error::$required/ is missing; this check needs updating rather than removing."
              exit 1
            fi
          done
          offenders=$(grep -rnE '^(struct|final class|class|enum) DeepSeek' App --include="*.swift" \
            | grep -v '^App/Provider/DeepSeek/' || true)
          if [ -n "$offenders" ]; then
            echo "::error::DeepSeek's wire types are declared outside App/Provider/DeepSeek/:"
            echo "$offenders"
            echo "A DTO that escaped would make the next Provider's differences everybody's problem, and would make DeepSeek's field names part of Zen's own vocabulary."
            exit 1
          fi
          echo "OK: DeepSeek's wire format is confined to App/Provider/DeepSeek/"

      - name: SecretValue must stay non-Codable
        run: |
          set -euo pipefail

          # A line whose first non-whitespace is a comment marker *names* this rule;
          # it does not break it. Same exclusion as the URLSession check, defined once
          # so that both shapes below are read the same way.
          comment_line=':[[:space:]]*(//|///|\*)'

          line=$(grep -n 'struct SecretValue' App/Credential/CredentialTypes.swift \
            | grep -vE "$comment_line" || true)
          if [ -z "$line" ]; then
            echo "::error::SecretValue has moved; this check needs updating rather than removing."
            exit 1
          fi
          if echo "$line" | grep -q "Codable"; then
            echo "::error::SecretValue became Codable. Not being Codable is what makes 'a secret cannot reach the database or the frozen seed' a compile-time property rather than a rule to remember."
            exit 1
          fi

          # The other shape, and the one a declaration-line grep cannot see: a
          # retroactive `extension SecretValue: Codable`, which is how it would
          # actually arrive. Encodable and Decodable are the same hole a word over —
          # either half is enough to write a secret out. This is a tripwire for the
          # shapes that occur in practice, not a conformance checker.
          conformances=$(
            grep -rnE 'struct SecretValue.*(Codable|Encodable|Decodable)|extension[[:space:]]+SecretValue.*(Codable|Encodable|Decodable)' \
              App --include="*.swift" \
              | grep -vE "$comment_line" || true
          )
          if [ -n "$conformances" ]; then
            echo "::error::SecretValue became Codable, here:"
            echo "$conformances"
            echo "An extension conforming it is the same escape as a conformance on the declaration: a secret that can be encoded is a secret that reaches the database, the seed, or an export."
            exit 1
          fi
          echo "OK: SecretValue is not Codable, on its declaration or in an extension"

      - name: Files that must stay versioned are not accidentally ignored
        run: |
          set -euo pipefail
          failed=0
          for f in \
            "project.yml" \
            "Config/Common.xcconfig" \
            "Config/Secrets.xcconfig.example" \
            "AGENTS.md" \
            "Docs/ADR/0001-persistence-engine.md"
          do
            # Two questions, and the step needs both answers.
            #
            # "Is it in the index?" must not be answerable with a shrug. `git
            # check-ignore` exits non-zero both for a path that is not ignored and
            # for a path that does not exist at all, so a file renamed away printed
            # OK. `ls-files --error-unmatch` exits non-zero for missing, ignored and
            # never-added alike, which is exactly the set that must not pass.
            #
            # "Does an ignore rule match it anyway?" needs --no-index to be worth
            # asking: plain check-ignore consults the index, so it answers "not
            # ignored" for precisely the tracked files this step is about. With
            # --no-index it reports the pattern, and a rule that covers a versioned
            # file is the accident this step is named after — the file is versioned
            # today, and would not survive a removal and re-add.
            if ! git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
              echo "::error::$f is not tracked. It must be versioned; if it was renamed, update this list rather than dropping the file."
              failed=1
            elif git check-ignore --no-index -q -- "$f"; then
              echo "::error::$f is tracked, but an ignore rule matches it — a removal and re-add would silently lose it."
              failed=1
            else
              echo "OK: $f is tracked and no ignore rule matches it"
            fi
          done
          exit $failed

  # -------------------------------------------------------------------------
  # Regenerate the project from project.yml, then build and test.
  # macOS 26 / Xcode 26 is required by the iOS 26 deployment target.
  # -------------------------------------------------------------------------
  build-and-test:
    name: Build and test
    needs: repo-hygiene
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: Managed build settings have one xcconfig source of truth
        shell: sh
        run: |
          set -eu

          managed_settings='IPHONEOS_DEPLOYMENT_TARGET SWIFT_VERSION SWIFT_STRICT_CONCURRENCY'
          temp_root="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          guard_tmp=$(mktemp -d "$temp_root/managed-build-settings.XXXXXX")
          trap 'rm -rf "$guard_tmp"' EXIT HUP INT TERM

          # First invariant: project.yml must not declare any managed setting.
          # Psych inspects YAML mapping keys, so comments do not count while
          # quoted keys, flow mappings and duplicate mapping keys are still seen.
          if ! command -v ruby >/dev/null 2>&1; then
            echo "::error::ruby is unavailable; project.yml cannot be checked safely."
            exit 1
          fi

          project_hits="$guard_tmp/project-yml-hits.txt"
          if ! ruby >"$project_hits" <<'RUBY'
          require "psych"
          require "date"

          managed = %w[
            IPHONEOS_DEPLOYMENT_TARGET
            SWIFT_VERSION
            SWIFT_STRICT_CONCURRENCY
          ].freeze

          source = File.read("project.yml")
          stream = Psych.parse_stream(source, filename: "project.yml")
          hits = []

          visit_yaml = nil
          visit_yaml = lambda do |node|
            if node.is_a?(Psych::Nodes::Mapping)
              node.children.each_slice(2) do |key_node, value_node|
                if key_node.is_a?(Psych::Nodes::Scalar) &&
                   managed.include?(key_node.value)
                  hits << "project.yml:#{key_node.start_line + 1}: #{key_node.value}"
                end
                visit_yaml.call(value_node)
              end
            # Scalar and Alias never initialise @children, so the reader returns nil
            # for them; only containers can be descended into. respond_to? is not
            # enough — every node class responds to :children and would then crash.
            elsif node.children
              node.children.each { |child| visit_yaml.call(child) }
            end
          end
          visit_yaml.call(stream)

          # Also inspect the resolved YAML object. This closes the exotic case
          # where an alias is used as a mapping key.
          if hits.empty?
            document = Psych.safe_load(source, aliases: true, permitted_classes: [Date, Time])
            visit_value = nil
            visit_value = lambda do |value, path|
              case value
              when Hash
                value.each do |key, child|
                  key_text = key.to_s
                  child_path = "#{path}.#{key_text}"
                  hits << "project.yml resolved path #{child_path}" if managed.include?(key_text)
                  visit_value.call(child, child_path)
                end
              when Array
                value.each_with_index do |child, index|
                  visit_value.call(child, "#{path}[#{index}]")
                end
              end
            end
            visit_value.call(document, "$")
          end

          puts hits.uniq
          RUBY
          then
            echo "::error::project.yml could not be parsed while checking managed settings."
            exit 1
          fi

          if [ -s "$project_hits" ]; then
            echo "::error::Managed build settings must not be declared in project.yml:"
            sed 's/^/  /' "$project_hits"
            echo "Config/*.xcconfig is their only source of truth."
            exit 1
          fi

          # Second invariant: every managed setting must have exactly one distinct,
          # literal value across Config/*.xcconfig.
          set -- Config/*.xcconfig
          if [ "$1" = 'Config/*.xcconfig' ] || [ ! -f "$1" ]; then
            echo "::error::No Config/*.xcconfig files were found."
            exit 1
          fi

          config_records="$guard_tmp/config-records.tsv"
          if ! awk '
            BEGIN {
              managed["IPHONEOS_DEPLOYMENT_TARGET"] = 1
              managed["SWIFT_VERSION"] = 1
              managed["SWIFT_STRICT_CONCURRENCY"] = 1
            }

            function strip_comments(text,    output, line_comment, block_comment) {
              output = ""

              while (length(text) > 0) {
                if (in_block_comment) {
                  block_comment = index(text, "*/")
                  if (block_comment == 0) {
                    return output
                  }

                  text = substr(text, block_comment + 2)
                  in_block_comment = 0
                  continue
                }

                line_comment = index(text, "//")
                block_comment = index(text, "/*")

                if (line_comment > 0 &&
                    (block_comment == 0 || line_comment < block_comment)) {
                  output = output substr(text, 1, line_comment - 1)
                  return output
                }

                if (block_comment > 0) {
                  output = output substr(text, 1, block_comment - 1)
                  text = substr(text, block_comment + 2)
                  in_block_comment = 1
                  block_start_file = FILENAME
                  block_start_line = FNR
                } else {
                  output = output text
                  return output
                }
              }

              return output
            }

            FNR == 1 && NR != 1 && in_block_comment {
              printf "::error file=%s,line=%d::Unterminated block comment in xcconfig.\n",
                     block_start_file, block_start_line
              bad = 1
              in_block_comment = 0
            }

            {
              code = strip_comments($0)
              sub(/^[[:space:]]+/, "", code)
              sub(/[[:space:]]+$/, "", code)

              if (code == "") {
                next
              }

              for (setting in managed) {
                boundary = "^" setting "([[:space:]]|\\[|=)"
                if (code !~ boundary) {
                  continue
                }

                assignment = "^" setting \
                             "([[:space:]]*\\[[^]]+\\])*" \
                             "[[:space:]]*="

                if (code !~ assignment) {
                  printf "::error file=%s,line=%d::Unsupported assignment syntax for %s.\n",
                         FILENAME, FNR, setting
                  bad = 1
                  next
                }

                value = code
                sub(assignment "[[:space:]]*", "", value)
                sub(/[[:space:]]+$/, "", value)

                if (value == "") {
                  printf "::error file=%s,line=%d::%s has an empty value.\n",
                         FILENAME, FNR, setting
                  bad = 1
                  next
                }

                if (value ~ /[$][(]/ || value ~ /[$][{]/) {
                  printf "::error file=%s,line=%d::%s uses variable expansion; managed settings must have one literal authority and may not use $(inherited).\n",
                         FILENAME, FNR, setting
                  bad = 1
                  next
                }

                if (value !~ /^[[:alnum:]_.+-]+$/) {
                  printf "::error file=%s,line=%d::%s must be one literal token; continuations and compound values are not accepted.\n",
                         FILENAME, FNR, setting
                  bad = 1
                  next
                }

                printf "%s\t%s:%d\t%s\n",
                       setting, FILENAME, FNR, value
              }
            }

            END {
              if (in_block_comment) {
                printf "::error file=%s,line=%d::Unterminated block comment in xcconfig.\n",
                       block_start_file, block_start_line
                bad = 1
              }

              if (bad) {
                exit 2
              }
            }
          ' "$@" >"$config_records"
          then
            cat "$config_records"
            echo "::error::Config/*.xcconfig could not be reduced to authoritative literal values."
            exit 1
          fi

          expected_values="$guard_tmp/expected-values.tsv"
          : >"$expected_values"

          for setting in $managed_settings; do
            raw_values="$guard_tmp/$setting.raw"
            unique_values="$guard_tmp/$setting.unique"

            if ! awk -F '	' -v setting="$setting" '
              $1 == setting { print $3 }
            ' "$config_records" >"$raw_values"
            then
              echo "::error::Failed to collect Config values for $setting."
              exit 1
            fi

            if ! LC_ALL=C sort -u "$raw_values" >"$unique_values"; then
              echo "::error::Failed to normalize Config values for $setting."
              exit 1
            fi

            value_count=$(awk 'END { print NR + 0 }' "$unique_values")
            if [ "$value_count" -ne 1 ]; then
              if [ "$value_count" -eq 0 ]; then
                echo "::error::$setting is not declared in Config/*.xcconfig."
              else
                echo "::error::$setting has $value_count competing Config values:"
                awk -F '	' -v setting="$setting" '
                  $1 == setting {
                    printf "  %s => %s\n", $2, $3
                  }
                ' "$config_records"
              fi
              exit 1
            fi

            expected_value=$(sed -n '1p' "$unique_values")
            printf '%s\t%s\n' "$setting" "$expected_value" >>"$expected_values"
          done

          # Third invariant: xcodebuild must resolve exactly the unique value
          # established above, for all three managed settings.
          build_settings="$guard_tmp/build-settings.txt"
          if ! xcodebuild \
                 -project ZenAgent.xcodeproj \
                 -scheme ZenAgent \
                 -showBuildSettings \
                 >"$build_settings" 2>&1
          then
            echo "::error::xcodebuild -showBuildSettings failed:"
            tail -n 40 "$build_settings"
            exit 1
          fi

          for setting in $managed_settings; do
            expected_value=$(awk -F '	' -v setting="$setting" '
              $1 == setting {
                print $2
                exit
              }
            ' "$expected_values")

            resolved_raw="$guard_tmp/$setting.resolved-raw"
            resolved_unique="$guard_tmp/$setting.resolved-unique"

            if ! awk -v setting="$setting" '
              {
                pattern = "^[[:space:]]*" setting \
                          "[[:space:]]*=[[:space:]]*"
              }

              $0 ~ pattern {
                value = $0
                sub(pattern, "", value)
                sub(/[[:space:]]+$/, "", value)
                if (value != "") {
                  print value
                }
              }
            ' "$build_settings" >"$resolved_raw"
            then
              echo "::error::Failed to parse xcodebuild value for $setting."
              exit 1
            fi

            if ! LC_ALL=C sort -u "$resolved_raw" >"$resolved_unique"; then
              echo "::error::Failed to normalize xcodebuild values for $setting."
              exit 1
            fi

            resolved_count=$(awk 'END { print NR + 0 }' "$resolved_unique")
            if [ "$resolved_count" -ne 1 ]; then
              echo "::error::$setting resolved to $resolved_count distinct values; expected exactly one:"
              sed 's/^/  /' "$resolved_unique"
              exit 1
            fi

            resolved_value=$(sed -n '1p' "$resolved_unique")
            if [ "$resolved_value" != "$expected_value" ]; then
              echo "::error::$setting resolved to '$resolved_value'; Config/*.xcconfig authoritatively declares '$expected_value'."
              exit 1
            fi

            echo "OK: $setting = $resolved_value"
          done

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ZenAgent.xcodeproj \
            -scheme ZenAgent

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project ZenAgent.xcodeproj \
            -scheme ZenAgent \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -quiet

      - name: List available simulators
        # Diagnostic only. If the destination below stops resolving, this shows
        # what the runner actually has.
        run: xcrun simctl list devices available

      - name: Run app unit tests
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available \
            | grep -E '^\s+iPhone' \
            | head -n 1 \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "${UDID:-}" ]; then
            echo "::error::No available iPhone simulator found. See the device list above."
            exit 1
          fi
          echo "Using simulator $UDID"
          touch "$RUNNER_TEMP/test-start.marker"

          set +e
          set -o pipefail
          xcodebuild test \
            -project ZenAgent.xcodeproj \
            -scheme ZenAgent \
            -configuration Debug \
            -destination "id=$UDID" \
            -resultBundlePath "$RUNNER_TEMP/ZenAgentTests.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/ZenAgentTests.log"
          XCODE_STATUS=${PIPESTATUS[0]}
          set -e

          # This workflow makes exactly one xcodebuild test invocation, with one
          # destination, one test target, and no retry or test-iteration options.
          # A normal invocation therefore has exactly one Swift Testing run start.
          # More than one proves that the test host was relaunched, independently
          # of the restart banner's wording. Keep the current banner only as a
          # fallback for a relaunch announced before its second run can begin.
          TEST_RUN_START_COUNT=0
          if [ -f "$RUNNER_TEMP/ZenAgentTests.log" ]; then
            TEST_RUN_START_COUNT=$(
              grep -cF '◇ Test run started.' \
                "$RUNNER_TEMP/ZenAgentTests.log" || true
            )
          fi

          if [ "$TEST_RUN_START_COUNT" -gt 1 ] || \
             grep -Fq 'Restarting after unexpected exit, crash, or test timeout' \
               "$RUNNER_TEMP/ZenAgentTests.log"; then
            echo "::error::Test-host restart evidence detected during the suite ($TEST_RUN_START_COUNT test-run starts); refusing a partial or relaunched run."
            exit 1
          fi

          exit "$XCODE_STATUS"

      - name: Inspect test host termination
        # Diagnostics only, and deliberately temporary.
        #
        # Gated on failure rather than run always. On a green run there is nothing to
        # diagnose, and this step exports a diagnostics bundle and decodes a logarchive
        # of well over a hundred megabytes. That is not a cost to pay on every clean
        # push.
        #
        # An ordinary failure has at most one test-run start and no restart banner, so
        # it returns before exporting anything. A repeated run-start is sufficient even
        # if the banner wording changes; the banner remains a fallback for a relaunch
        # that is announced but dies before the second run starts.
        # machinery exists for, goes on to the full export.
        if: failure()
        shell: bash
        run: |
          set -uo pipefail

          TEST_RUN_START_COUNT=0
          if [ -f "$RUNNER_TEMP/ZenAgentTests.log" ]; then
            TEST_RUN_START_COUNT=$(
              grep -cF '◇ Test run started.' \
                "$RUNNER_TEMP/ZenAgentTests.log" || true
            )
          fi

          if [ "$TEST_RUN_START_COUNT" -le 1 ] && \
             ! grep -Fq 'Restarting after unexpected exit, crash, or test timeout' \
               "$RUNNER_TEMP/ZenAgentTests.log" 2>/dev/null; then
            echo "No test-host restart evidence in this run ($TEST_RUN_START_COUNT test-run start(s)); nothing to diagnose."
            exit 0
          fi

          echo "Test-host restart evidence found ($TEST_RUN_START_COUNT test-run start(s)); collecting diagnostics."

          DIAG="$RUNNER_TEMP/xcdiagnostics"
          DECODED="$RUNNER_TEMP/decoded-system-logs"
          REPORTS="$RUNNER_TEMP/DiagnosticReports"
          IPS_SUMMARY="$RUNNER_TEMP/ips-summary.txt"
          SUMMARY="$RUNNER_TEMP/termination-summary.txt"

          rm -rf "$DIAG" "$DECODED" "$REPORTS"
          mkdir -p "$DECODED" "$REPORTS"

          echo "=== xcresult console log ==="
          if [ -d "$RUNNER_TEMP/ZenAgentTests.xcresult" ]; then
            xcrun xcresulttool get log \
              --path "$RUNNER_TEMP/ZenAgentTests.xcresult" \
              --type console \
              > "$RUNNER_TEMP/xcresult-console.log" \
              2> "$RUNNER_TEMP/xcresult-console.stderr" || true

            xcrun xcresulttool export diagnostics \
              --path "$RUNNER_TEMP/ZenAgentTests.xcresult" \
              --output-path "$DIAG" \
              > "$RUNNER_TEMP/xcresult-export-diagnostics.log" \
              2> "$RUNNER_TEMP/xcresult-export-diagnostics.stderr" || true
          else
            echo "ZenAgentTests.xcresult was not produced" \
              > "$RUNNER_TEMP/xcresult-console.stderr"
          fi

          # export diagnostics normally creates this directory itself. Create it only
          # afterwards so a failed export still leaves the rest of this step runnable.
          mkdir -p "$DIAG"

          echo "=== decode Unified Logging archives ==="
          archive_count=0
          while IFS= read -r -d '' archive; do
            archive_count=$((archive_count + 1))
            number=$(printf '%03d' "$archive_count")
            output="$DECODED/system-$number.log"

            echo "Decoding: $archive"

            # Correct decoder for .logarchive / tracev3.
            #
            # Deliberately do not use a process or message predicate here:
            # the exact name/PID of the first test-host process is evidence we are
            # trying to discover, and an incorrect predicate could discard it.
            /usr/bin/log show \
              --archive "$archive" \
              --style syslog \
              --timezone local \
              --info \
              --debug \
              --no-signpost \
              --no-pager \
              --color none \
              > "$output" \
              2> "$output.stderr" || true
          done < <(
            find "$DIAG" -type d -name '*.logarchive' -print0 2>/dev/null
          )

          echo "Decoded $archive_count log archive(s)"

          echo "=== copy DiagnosticReports created after test start ==="
          report_count=0

          if [ -f "$RUNNER_TEMP/test-start.marker" ] && \
             [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then

            while IFS= read -r -d '' report; do
              report_count=$((report_count + 1))
              number=$(printf '%03d' "$report_count")
              base=$(basename "$report")
              destination="$REPORTS/$number-$base"

              cp -p "$report" "$destination"

              printf '%s\t%s\n' \
                "$destination" \
                "$report" \
                >> "$REPORTS/index.txt"
            done < <(
              find "$HOME/Library/Logs/DiagnosticReports" \
                -type f \
                -newer "$RUNNER_TEMP/test-start.marker" \
                -print0 2>/dev/null
            )
          fi

          echo "Copied $report_count DiagnosticReports file(s)"

          echo "=== parse modern .ips crash reports ==="

          python3 - "$REPORTS" "$DIAG" > "$IPS_SUMMARY" <<'PY' || true
          import json
          import sys
          from pathlib import Path

          roots = [Path(arg) for arg in sys.argv[1:]]
          reports = []
          seen = set()

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*.ips"):
                  resolved = str(path.resolve())
                  if resolved not in seen:
                      seen.add(resolved)
                      reports.append(path)

          if not reports:
              print("(no .ips crash reports found)")
              raise SystemExit(0)

          for path in sorted(reports):
              print(f"FILE: {path}")

              try:
                  with path.open("r", encoding="utf-8", errors="replace") as f:
                      first_line = f.readline()
                      remainder = f.read()

                  metadata = json.loads(first_line)
                  report = json.loads(remainder)
              except Exception as exc:
                  print(f"  parse-error: {exc}")
                  print()
                  continue

              exception = report.get("exception") or {}
              termination = report.get("termination") or {}

              process = (
                  report.get("procName")
                  or metadata.get("name")
                  or "(unknown)"
              )

              print(f"  process: {process}")
              print(f"  pid: {report.get('pid')}")
              print(f"  captureTime: {report.get('captureTime')}")
              print(f"  bug_type: {metadata.get('bug_type')}")

              exc_type = exception.get("type")
              signal = exception.get("signal")
              codes = exception.get("codes")
              message = exception.get("message")

              print(f"  Exception Type: {exc_type} ({signal})")
              print(f"  Exception Codes: {codes}")
              if message is not None:
                  print(f"  Exception Message: {message}")

              namespace = termination.get("namespace")
              code = termination.get("code")
              indicator = termination.get("indicator")

              if isinstance(code, int):
                  code_display = f"{code} ({hex(code)})"
              else:
                  code_display = str(code)

              print(
                  "  Termination Reason: "
                  f"namespace={namespace} "
                  f"code={code_display} "
                  f"indicator={indicator}"
              )

              faulting = report.get("faultingThread")
              print(f"  faultingThread: {faulting}")

              threads = report.get("threads") or []
              images = report.get("usedImages") or []

              if (
                  isinstance(faulting, int)
                  and 0 <= faulting < len(threads)
              ):
                  frames = threads[faulting].get("frames") or []
                  print("  faulting frames:")

                  for index, frame in enumerate(frames[:12]):
                      image_index = frame.get("imageIndex")
                      image_name = "?"

                      if (
                          isinstance(image_index, int)
                          and 0 <= image_index < len(images)
                      ):
                          image_name = images[image_index].get("name", "?")

                      symbol = frame.get("symbol")
                      image_offset = frame.get("imageOffset")

                      if symbol:
                          location = frame.get("symbolLocation")
                          if location is not None:
                              symbol = f"{symbol} + {location}"
                      elif isinstance(image_offset, int):
                          symbol = f"image+{hex(image_offset)}"
                      else:
                          symbol = "(unknown)"

                      print(
                          f"    {index}: "
                          f"{image_name} "
                          f"{symbol}"
                      )

              print()
          PY

          # Search only decoded/textual material. Do not grep raw tracev3 data.
          scan_all() {
            local regex="$1"
            local file

            for file in \
              "$RUNNER_TEMP/ZenAgentTests.log" \
              "$RUNNER_TEMP/xcresult-console.log" \
              "$IPS_SUMMARY"
            do
              if [ -f "$file" ]; then
                grep -IHniE "$regex" "$file" 2>/dev/null || true
              fi
            done

            for root in "$DECODED" "$REPORTS" "$DIAG"; do
              [ -d "$root" ] || continue

              while IFS= read -r -d '' file; do
                case "$file" in
                  *.ips)
                    # Already parsed into ips-summary.txt.
                    continue
                    ;;
                  *.logarchive/*)
                    # Raw Unified Logging storage. It was decoded with log show above.
                    continue
                    ;;
                esac

                grep -IHniE "$regex" "$file" 2>/dev/null || true
              done < <(
                find "$root" -type f -print0 2>/dev/null
              )
            done
          }

          {
            echo "===== PARSED CRASH REPORTS ====="
            cat "$IPS_SUMMARY"
            echo

            echo "===== SIGNAL / MEMORY-FAULT EVIDENCE ====="
            scan_all \
              'SIGPIPE|SIGKILL|SIGABRT|EXC_BAD_ACCESS|SIGSEGV|SIGBUS|Broken pipe|signal[[:space:]:=]+(13|9|6)([^0-9]|$)'
            echo

            echo "===== TERMINATION-REASON EVIDENCE ====="
            scan_all \
              'Termination Reason|Termination Signal|exited due to signal|termination[^[:cntrl:]]*namespace|namespace[[:space:]:=]+"?SIGNAL'
            echo

            echo "===== OS WATCHDOG EVIDENCE ====="
            scan_all \
              '0x8badf00d|2343432205|WatchdogEvent|watchdog transgression|exhausted real .*time allowance'
            echo

            echo "===== EXPLICIT XCTEST TIMEOUT EVIDENCE ====="
            # Intentionally does NOT match the generic
            # "unexpected exit, crash, or test timeout" restart banner.
            scan_all \
              'test( case)?[^[:cntrl:]]*(timed out|exceeded[^[:cntrl:]]*time)|timed out waiting for test|test execution[^[:cntrl:]]*timeout'
          } > "$SUMMARY"

          cat "$SUMMARY"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: |
            ${{ runner.temp }}/ZenAgentTests.xcresult
            ${{ runner.temp }}/ZenAgentTests.log
            ${{ runner.temp }}/test-start.marker
            ${{ runner.temp }}/xcresult-console.log
            ${{ runner.temp }}/xcresult-console.stderr
            ${{ runner.temp }}/xcresult-export-diagnostics.log
            ${{ runner.temp }}/xcresult-export-diagnostics.stderr
            ${{ runner.temp }}/xcdiagnostics
            ${{ runner.temp }}/decoded-system-logs
            ${{ runner.temp }}/DiagnosticReports
            ${{ runner.temp }}/ips-summary.txt
            ${{ runner.temp }}/termination-summary.txt
          if-no-files-found: ignore
          retention-days: 7
