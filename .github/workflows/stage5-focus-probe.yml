name: Stage 5 cold focus control
on:
  push:
    branches: [codex/s5-handoff-repairs-20261007]
    paths: [.github/workflows/stage5-focus-probe.yml]
permissions:
  contents: read
jobs:
  cold-and-related:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Cold original false and true cases
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -n 1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          test -n "$UDID"
          echo "PROBE_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild test -project ZenAgent.xcodeproj -scheme ZenAgent \
            -configuration Debug -destination "id=$UDID" \
            '-only-testing:ZenAgentTests/WorkspaceComposerDockTests/focusIntentSurvivesOutgoingThenIncomingThenDockUpdateOrder(preserveOutgoing:)' \
            -resultBundlePath "$RUNNER_TEMP/ColdFocus.xcresult" 2>&1 | tee "$RUNNER_TEMP/ColdFocus.log"
          grep -Eq 'Test run with 1 test in 1 suite passed' "$RUNNER_TEMP/ColdFocus.log"
          grep -Fq 'preserveOutgoing → false' "$RUNNER_TEMP/ColdFocus.log"
          grep -Fq 'preserveOutgoing → true' "$RUNNER_TEMP/ColdFocus.log"
          ! grep -Fq 'Restarting after unexpected exit, crash, or test timeout' "$RUNNER_TEMP/ColdFocus.log"
      - name: Related original and fixture regressions
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test -project ZenAgent.xcodeproj -scheme ZenAgent \
            -configuration Debug -destination "id=$PROBE_UDID" \
            -only-testing:ZenAgentTests/WorkspaceComposerDockTests \
            -only-testing:ZenAgentTests/ComposerHostIntegrationTests \
            -only-testing:ZenAgentTests/ComposerOverlayFocusTests \
            -only-testing:ZenAgentTests/ComposerExitLayoutTests \
            -only-testing:ZenAgentTests/ConversationSurfaceHostTests \
            -only-testing:ZenAgentTests/SurfaceLiftHostTests \
            -only-testing:ZenAgentTests/SidebarSurfaceTests \
            -only-testing:ZenAgentTests/DeviceFeedbackGeometryTests \
            -only-testing:ZenAgentTests/CurrentCardEdgeTests \
            -only-testing:ZenAgentTests/AppSpaceInkRendererTests \
            -only-testing:ZenAgentTests/AppShellWiringTests \
            -resultBundlePath "$RUNNER_TEMP/RelatedFocus.xcresult" 2>&1 | tee "$RUNNER_TEMP/RelatedFocus.log"
          ! grep -Fq 'Restarting after unexpected exit, crash, or test timeout' "$RUNNER_TEMP/RelatedFocus.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-focus-control-logs
          path: |
            ${{ runner.temp }}/ColdFocus.log
            ${{ runner.temp }}/RelatedFocus.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-focus-control-results
          path: |
            ${{ runner.temp }}/ColdFocus.xcresult
            ${{ runner.temp }}/RelatedFocus.xcresult
          retention-days: 7
