name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  console-evidence:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39409646340
          pattern: composer-menu-*
          merge-multiple: true
          path: previous
      - name: Decode existing result without a build or test rerun
        shell: bash
        run: |
          xcrun xcresulttool export diagnostics --path previous/Focused.xcresult --output-path decoded
          find decoded -type f > diagnostic-files.txt
          grep -R -a -n 'COMPOSER_KEYBOARD_MENU' decoded > close-diagnostics.txt || true
          cat close-diagnostics.txt | head -c 20000
          cat diagnostic-files.txt | head -n 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composer-close-evidence
          path: |
            close-diagnostics.txt
            diagnostic-files.txt
            decoded/**/*.txt
            decoded/**/*.log
